# yamllint config for the gate (tools/gate.sh). Docs and compose files here do not start with `---`, and `on:` in workflows is a key, not a boolean.
extends: default
rules:
  document-start: disable
  truthy:
    check-keys: false
  line-length:
    max: 200
    level: error
  comments:
    min-spaces-from-content: 1
  # compose.yaml sits at the repository root, where the environment may not ship a .gitattributes (attempt territory), so a Windows
  # checkout with core.autocrlf=true has CRLF in it (found in the Milestone 2 clone rehearsal). Committed line endings are checked
  # by the release gate (no-crlf, on the index) instead.
  new-lines: disable
