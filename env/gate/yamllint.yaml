# yamllint config for the gate (tools/gate.sh). Docs and compose files here do not start with `---`, and `on:` in workflows is a key, not a boolean.
extends: default
rules:
  document-start: disable
  truthy:
    check-keys: false
  line-length:
    max: 200
    level: error
  comments:
    min-spaces-from-content: 1
