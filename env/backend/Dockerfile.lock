# check=skip=InvalidDefaultArgInFrom
# The base-image ARGs below have no default on purpose: compose.yaml supplies them from env/pins.env, the single place pins live.
# Generates the two hash-pinned files in env/backend/ (constraints.txt, build-tools.txt) inside a Linux
# container on the digest-pinned Python base. Run it through tools/lock-backend.sh, never by hand.
# The upstream pyproject.toml is fetched at the pinned SHA (never vendored).
ARG PYTHON_IMAGE
FROM ${PYTHON_IMAGE} AS lock
ARG BACKEND_REPO
ARG BACKEND_SHA
ARG PIP_TOOLS_VERSION

# psycopg2 is source-only: pip-compile has to build its metadata, which calls pg_config (libpq-dev) and a compiler.
RUN apt-get update \
    && apt-get install -y --no-install-recommends gcc libpq-dev \
    && rm -rf /var/lib/apt/lists/*
RUN pip install --no-cache-dir "pip-tools==${PIP_TOOLS_VERSION}" && pip freeze

ADD ${BACKEND_REPO}#${BACKEND_SHA} /src
WORKDIR /work
COPY lock-seed.txt build-tools.in ./

RUN set -eu; \
    pyv="$(python --version)"; pipv="$(pip --version | cut -d' ' -f1-2)"; \
    ptv="$(pip-compile --version)"; \
    mkdir /out; \
    { \
      echo "# GENERATED by tools/lock-backend.sh. Do not edit by hand."; \
      echo "# Backend: ${BACKEND_REPO%.git} @ ${BACKEND_SHA}"; \
      echo "# Source: [project].dependencies of its pyproject.toml (extra 'dev' not included), resolved under lock-seed.txt."; \
      echo "# Generated with: ${pyv}, ${pipv}, ${ptv}"; \
      echo "# Install with -r (not -c): pip enforces --require-hashes only for requirements it is given directly."; \
      echo "#   pip install --require-hashes --no-build-isolation -r constraints.txt   (after build-tools.txt; see Dockerfile)"; \
      pip-compile --quiet --generate-hashes --no-header --strip-extras \
        --constraint lock-seed.txt --output-file=- /src/pyproject.toml; \
    } > /out/constraints.txt; \
    { \
      echo "# GENERATED by tools/lock-backend.sh from build-tools.in. Do not edit by hand."; \
      echo "# Generated with: ${pyv}, ${pipv}, ${ptv}"; \
      pip-compile --quiet --generate-hashes --no-header --strip-extras --allow-unsafe \
        --output-file=- build-tools.in; \
    } > /out/build-tools.txt;


FROM scratch AS out
COPY --from=lock /out/ /
