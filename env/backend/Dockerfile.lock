# check=skip=InvalidDefaultArgInFrom
# The base-image ARGs below have no default on purpose: tools/lock-backend.sh supplies them from env/pins.env, the single place pins live.
# Generates the two hash-pinned lock files in env/backend/ (requirements.lock.txt, build-tools.lock.txt) inside a Linux
# container on the digest-pinned Python base. Run it through tools/lock-backend.sh, never by hand.
# Only the upstream pyproject.toml is needed; it is fetched at the pinned SHA without upstream's submodules (never vendored).
ARG PYTHON_IMAGE
FROM ${PYTHON_IMAGE} AS lock
ARG BACKEND_REPO
ARG BACKEND_SHA
ARG PIP_TOOLS_VERSION

# gcc + libpq-dev: psycopg2 is source-only and pip-compile has to build its metadata, which calls pg_config.
# git: fetches the pinned commit of the upstream repo.
RUN apt-get update \
    && apt-get install -y --no-install-recommends git gcc libpq-dev \
    && rm -rf /var/lib/apt/lists/*
RUN pip install --no-cache-dir "pip-tools==${PIP_TOOLS_VERSION}" && pip freeze

RUN set -eu; \
    git init -q /src; cd /src; \
    git fetch -q --depth 1 "$BACKEND_REPO" "$BACKEND_SHA"; \
    git checkout -q --detach FETCH_HEAD; \
    test "$(git rev-parse HEAD)" = "$BACKEND_SHA"; \
    rm -rf .git
WORKDIR /work
COPY lock-seed.txt build-tools.in ./

RUN set -eu; \
    pyv="$(python --version)"; pipv="$(pip --version | cut -d' ' -f1-2)"; \
    ptv="$(pip-compile --version)"; \
    mkdir /out; \
    { \
      echo "# GENERATED by tools/lock-backend.sh. Do not edit by hand."; \
      echo "# Backend: ${BACKEND_REPO%.git} @ ${BACKEND_SHA}"; \
      echo "# Source: [project].dependencies of its pyproject.toml (extra 'dev' not included), resolved under lock-seed.txt."; \
      echo "# Generated with: ${pyv}, ${pipv}, ${ptv}"; \
      echo "# This is a requirements lock, installed with -r: pip enforces --require-hashes only for requirements it is given directly (not through -c)."; \
      echo "#   pip install --require-hashes --no-build-isolation -r requirements.lock.txt   (after build-tools.lock.txt; see Dockerfile)"; \
      pip-compile --quiet --generate-hashes --no-header --strip-extras \
        --constraint lock-seed.txt --output-file=- /src/pyproject.toml; \
    } > /out/requirements.lock.txt; \
    { \
      echo "# GENERATED by tools/lock-backend.sh from build-tools.in. Do not edit by hand."; \
      echo "# Generated with: ${pyv}, ${pipv}, ${ptv}"; \
      pip-compile --quiet --generate-hashes --no-header --strip-extras --allow-unsafe \
        --output-file=- build-tools.in; \
    } > /out/build-tools.lock.txt

FROM scratch AS out
COPY --from=lock /out/ /
